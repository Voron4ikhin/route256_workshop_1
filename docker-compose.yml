version: "3.1"
services:
  cart:
    image: cart
    build: ./cart/
    env_file:
      - .env
    ports:
      - "8082:8080"
    depends_on:
      - loms
  loms:
    image: loms
    build: ./loms/
    env_file:
      - .env
    ports:
      - "8083:8080"
      - "50051:50051"
